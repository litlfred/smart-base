# Reusable workflow: full FHIR IG build and GitHub Pages deployment.
#
# Split-checkout model
# ────────────────────
# This workflow separates *content* (the IG's FHIR Shorthand, pages, images,
# DMN files …) from the *scripts* that preprocess and postprocess around the
# IG Publisher.
#
#   • Content comes from the ref that triggered the event (or the explicit
#     `ref` input, e.g. a PR head SHA).
#   • Scripts are fetched from the smart-base repository at the ref given by
#     `scripts_ref` (default: main).
#
# This means feature-branch PRs only need to carry content changes.  The
# build tooling always comes from a known-good baseline (main), unless a
# trusted contributor explicitly overrides `scripts_ref` for testing new
# script code — which requires environment approval in the caller workflow.
#
# For downstream WHO SMART Guidelines IGs that call this workflow via
# workflow_call, scripts are bulk-downloaded from smart-base via a tarball so
# that all scripts and their shared dependencies are available together.
# The `scripts_ref` input controls which smart-base branch those downloads
# target.
#
# Unified environment
# ───────────────────
# Python pre/post-processing and the FHIR IG Publisher all run on the same
# GitHub Actions host runner.  Java, Node/SUSHI, and Python are set up via
# standard actions (setup-java, setup-node, setup-python) so that every
# stage shares the same filesystem, environment variables, and user context.
# This eliminates Docker ownership issues and ensures scripts can interact
# with IG Publisher input/output without permission mismatches.
#
# Make sure your repo has a branch called gh-pages.
#
# Change log:
# 2021-06-18: (JCT): publish default branches to / , other branches branches/<branch>
# 2021-11-26: (JCT): Reusable workflow
# 2022-01-28: (JCT): add auto-create gh-pages if it doesn't exist
# 2023-01-22: (JCT): use checkout action v3, and JamesIves/github-pages-deploy-action@v4
# 2026-03-xx: Remove direct push/PR triggers; add git safe.directory fix for Docker step.
# 2026-03-xx: Add split-checkout model with scripts_ref input.
# 2026-03-19: Unified host-based build; bulk script download; injection hardening.

name: FHIR IG Build and GitHub Pages Deployment

on:
  workflow_call: # Reusable by other workflows
    inputs:
      ref:
        description: 'Git ref to check out for content (e.g. PR head SHA).  When empty the default ref for the triggering event is used.'
        required: false
        type: string
      scripts_ref:
        description: 'Branch/ref of smart-base to fetch pre/post-processing scripts from (default: main).  Non-default values require approval in the caller workflow.'
        required: false
        type: string
        default: 'main'
      tx:
        required: false
        type: string
      do_dak:
        description: 'Enable DAK preprocessing and postprocessing'
        required: false
        type: boolean
        default: true
      deploy:
        description: 'Deploy the built IG to GitHub Pages'
        required: false
        type: boolean
        default: true

  # Allows you to run this workflow manually from the Actions tab
  # (useful for downstream repos and for ad-hoc smart-base builds).
  workflow_dispatch:
    inputs:
      scripts_ref:
        description: 'Branch/ref of smart-base to fetch scripts from (default: main)'
        required: false
        type: string
        default: 'main'
      tx:
        description: 'Optional Custom terminology server URL'
        required: false
      do_dak:
        description: 'Enable DAK preprocessing and postprocessing'
        required: false
        type: boolean
        default: true
      deploy:
        description: 'Deploy the built IG to GitHub Pages'
        required: false
        type: boolean
        default: true

# NOTE: No workflow-level concurrency block here.  When this workflow is
# invoked via workflow_call, github.workflow resolves to the *caller's*
# workflow name.  If both the caller (e.g. ci.yml) and this reusable
# workflow define the same concurrency group, GitHub detects a deadlock
# and cancels the run.  Callers are responsible for their own concurrency
# controls.  For standalone workflow_dispatch runs, concurrency is not
# typically needed because they are triggered manually and intentionally.

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    permissions:
      contents: write        # required for JamesIves/github-pages-deploy-action to push gh-pages
      pull-requests: write   # required for PR build-status comment steps
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Record checkout timestamp
        run: echo "TS_CHECKOUT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      # ── Resolve the smart-base scripts source ──────────────────────────
      # Sets SCRIPTS_REF (sanitized) for later steps.
      - name: Resolve scripts source
        env:
          SCRIPTS_REF_INPUT: ${{ inputs.scripts_ref || 'main' }}
        run: |
          # Sanitize: allow only valid Git ref characters
          SCRIPTS_REF="$(printf '%s' "$SCRIPTS_REF_INPUT" | tr -cd 'a-zA-Z0-9._/-')"
          if [ -z "$SCRIPTS_REF" ]; then
            SCRIPTS_REF="main"
          fi
          printf 'SCRIPTS_REF=%s\n' "$SCRIPTS_REF"
          printf 'SCRIPTS_REF=%s\n' "$SCRIPTS_REF" >> "$GITHUB_ENV"

      # ── Overlay smart-base scripts onto content checkout ───────────────
      # When running inside the smart-base repository, the content checkout
      # may contain locally-modified copies of scripts.  This step replaces
      # them with the canonical versions from SCRIPTS_REF so that PR
      # branches only need to carry content, not build tooling.
      #
      # For downstream repos this step is a no-op — scripts are fetched in
      # bulk in the next step.
      - name: Overlay smart-base scripts
        env:
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          # Only overlay when running inside the smart-base repository.
          SMART_BASE_REPO="WorldHealthOrganization/smart-base"
          if [[ "$GH_REPOSITORY" != "$SMART_BASE_REPO" ]]; then
            echo "Downstream repository — scripts will be fetched in bulk"
            exit 0
          fi

          echo "Smart-base repo detected — overlaying scripts from ${SCRIPTS_REF}"
          git fetch origin "${SCRIPTS_REF}" --depth=1
          # Overlay input/scripts/ and supporting includes from the scripts ref.
          # This overwrites any locally-modified copies with the canonical versions.
          git checkout FETCH_HEAD -- input/scripts/
          git checkout FETCH_HEAD -- input/includes/dmn2html.xslt input/includes/dmn.css 2>/dev/null || true
          echo "Scripts overlaid from ${SCRIPTS_REF}"

      # ── Bulk-download scripts for downstream repos ─────────────────────
      # Instead of downloading scripts one-by-one via curl (which misses
      # shared dependencies like dak_url_utils.py, translation_config.py),
      # download the entire input/scripts/ and input/includes/ directories
      # from smart-base as a tarball.  This ensures all scripts and their
      # shared modules are available together.
      - name: Download smart-base scripts (downstream repos)
        env:
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          SMART_BASE_REPO="WorldHealthOrganization/smart-base"
          if [[ "$GH_REPOSITORY" == "$SMART_BASE_REPO" ]]; then
            echo "Smart-base repo — scripts already overlaid, skipping download"
            exit 0
          fi

          echo "Downloading scripts from smart-base@${SCRIPTS_REF}..."
          TARBALL_URL="https://github.com/WorldHealthOrganization/smart-base/archive/${SCRIPTS_REF}.tar.gz"

          # Download and extract only input/scripts/ and input/includes/
          # into a temporary directory, then overlay onto the workspace.
          TMPDIR="$(mktemp -d)"
          if ! curl -L -f -o "${TMPDIR}/smart-base.tar.gz" "$TARBALL_URL" 2>/dev/null; then
            echo "::error::Failed to download smart-base tarball from ${TARBALL_URL}"
            exit 1
          fi

          # Extract input/scripts/ and input/includes/ from the tarball.
          # The tarball root is smart-base-<ref>/, so we strip the first
          # path component and filter to just the directories we need.
          mkdir -p input/scripts input/includes
          tar -xzf "${TMPDIR}/smart-base.tar.gz" -C "$TMPDIR" --strip-components=1 \
            --wildcards '*/input/scripts/*' '*/input/includes/*' 2>/dev/null || true

          # Copy extracted files into the workspace (don't overwrite local files)
          if [ -d "${TMPDIR}/input/scripts" ]; then
            cp -rn "${TMPDIR}/input/scripts/"* input/scripts/ 2>/dev/null || true
            echo "Scripts downloaded: $(ls input/scripts/*.py 2>/dev/null | wc -l) Python files"
          fi
          if [ -d "${TMPDIR}/input/includes" ]; then
            cp -rn "${TMPDIR}/input/includes/"* input/includes/ 2>/dev/null || true
            echo "Includes downloaded: $(ls input/includes/ 2>/dev/null | wc -l) files"
          fi

          rm -rf "$TMPDIR"
          echo "Smart-base scripts downloaded from ${SCRIPTS_REF}"

      # ── Environment setup ──────────────────────────────────────────────
      # All tools (Python, Java, Node/SUSHI) are installed on the host so
      # that pre-processing, the IG Publisher, and post-processing share
      # the same unified environment.

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "GitPython>=3.1.40" "PyYAML>=6.0" "requests>=2.28.0" lxml

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install SUSHI
        run: |
          npm install -g fsh-sushi
          sushi --version

      # ── Branch resolution and PR detection ─────────────────────────────

      - name: Find PR number
        id: find_pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_EVENT_NAME: ${{ github.event_name }}
          GH_EVENT_NUMBER: ${{ github.event.number }}
          GH_REF_NAME: ${{ github.ref_name }}
        run: python3 input/scripts/find_pr.py

      - name: Comment on PR - Build started
        if: steps.find_pr.outputs.IS_PR == 'true'
        env:
          PR_NUMBER: ${{ steps.find_pr.outputs.PR_NUMBER }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_RUN_ID: ${{ github.run_id }}
          GH_SHA: ${{ github.sha }}
          GH_BRANCH: ${{ github.head_ref || github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f "input/scripts/pr_comment_start.py" ]; then
            python3 input/scripts/pr_comment_start.py \
              "$PR_NUMBER" \
              "$GH_REPOSITORY" \
              "$GH_RUN_ID" \
              "$GH_SHA" \
              "$GH_BRANCH" \
              "$GH_TOKEN"
          else
            echo "PR comment script not available, skipping build start comment"
          fi

      - name: Get branch name
        env:
          GH_HEAD_REF: ${{ github.head_ref }}
          GH_REF_NAME: ${{ github.ref_name }}
        run: python3 input/scripts/resolve_branch.py

      - name: Check if default branch
        run: |
          echo "Current Branch: $BRANCH_NAME"
          DEFAULT_BRANCH=$(git remote show origin | sed -n '/HEAD branch/s/.*: //p')
          echo "Default Branch: $DEFAULT_BRANCH"
          if [ "$BRANCH_NAME" = "$DEFAULT_BRANCH" ]; then
            echo "This is the default branch."
            echo "IS_DEFAULT_BRANCH=true" >> "$GITHUB_ENV"
          else
            echo "This is NOT the default branch."
            echo "IS_DEFAULT_BRANCH=false" >> "$GITHUB_ENV"
          fi

      # ── DAK Preprocessing ─────────────────────────────────────────────

      - name: Prepare DAK environment
        if: inputs.do_dak != 'false'
        run: |
          echo "Preparing DAK environment with configuration scripts..."

          # Generate DAK configuration from sushi config
          if [ -f "input/scripts/generate_dak_from_sushi.py" ]; then
            echo "Running generate_dak_from_sushi.py..."
            python3 input/scripts/generate_dak_from_sushi.py
            echo "DAK configuration processing completed"
          else
            echo "generate_dak_from_sushi.py not available, skipping DAK generation"
          fi

          # Update sushi config with DAK API settings
          if [ -f "input/scripts/update_sushi_config.py" ]; then
            echo "Running update_sushi_config.py..."
            python3 input/scripts/update_sushi_config.py
            echo "Sushi configuration updated for DAK API"
          else
            echo "update_sushi_config.py not available, skipping sushi config update"
          fi

      - name: Check for DAK configuration
        env:
          DO_DAK: ${{ inputs.do_dak }}
        run: |
          if [ "$DO_DAK" = "false" ]; then
            echo "Not generating DAK"
            exit 0
          fi
          echo "DAK processing enabled, checking for dak.json..."
          if [ -f "dak.json" ]; then
            echo "Found dak.json - DAK processing will be enabled"
            echo "DAK_ENABLED=true" >> "$GITHUB_ENV"
          else
            echo "do_dak=true but no dak.json found in repository root"
            echo "DAK processing will be skipped"
            echo "DAK_ENABLED=false" >> "$GITHUB_ENV"
          fi

      - name: DAK Preprocessing - Regenerate DAK configuration with current context
        if: (inputs.do_dak != 'false') && (env.DAK_ENABLED == 'true')
        run: |
          echo "Regenerating DAK configuration with current branch context..."
          if [ -f "input/scripts/generate_dak_from_sushi.py" ]; then
            python3 input/scripts/generate_dak_from_sushi.py
            echo "DAK configuration regenerated with current context"
          else
            echo "DAK generation script not available, using existing dak.json"
          fi

      - name: DAK Preprocessing - Generate DMN Questionnaires
        if: (inputs.do_dak != 'false') && (env.DAK_ENABLED == 'true')
        run: |
          echo "Generating FHIR Questionnaires from DMN files before IG publisher runs..."
          if [ -f "input/scripts/dmn_questionnaire_generator.py" ]; then
            python3 input/scripts/dmn_questionnaire_generator.py
            echo "Questionnaires generated successfully"
          else
            echo "DMN questionnaire generator not available, skipping"
          fi

      - name: DAK Preprocessing - Transform DMN files to HTML
        if: inputs.do_dak != 'false' && env.DAK_ENABLED == 'true'
        run: |
          echo "Transforming DMN files to HTML before IG publisher runs..."
          if [ -f "input/scripts/transform_dmn.py" ]; then
            python3 input/scripts/transform_dmn.py
            echo "DMN files transformed successfully"
          else
            echo "DMN transformation script not available, skipping"
          fi

      - name: DAK Preprocessing - Inject diagram translations
        if: inputs.do_dak != 'false' && env.DAK_ENABLED == 'true'
        run: |
          echo "Injecting translations into diagram sources before IG publisher runs..."
          if [ -f "input/scripts/inject_translations.py" ]; then
            python3 input/scripts/inject_translations.py
            echo "Diagram translations injected successfully"
          else
            echo "Translation injection script not available, skipping"
          fi

      # ── FHIR IG Publisher ──────────────────────────────────────────────
      # The publisher runs directly on the host alongside Python and SUSHI.
      # No Docker container is used, so all stages share the same
      # filesystem and user context.

      - name: Download latest IG Publisher
        run: |
          mkdir -p ./input-cache
          curl -L -f https://github.com/HL7/fhir-ig-publisher/releases/latest/download/publisher.jar \
            -o ./input-cache/publisher.jar

      - name: Create package cache folder
        run: mkdir -p ./fhir-package-cache

      - name: Run the IG Publisher
        env:
          INPUT_TX: ${{ inputs.tx }}
          JAVA_TOOL_OPTIONS: '-Dfile.encoding=UTF-8'
        run: |
          echo "TX input: $INPUT_TX"

          # Build the -repo URL using the sanitized BRANCH_NAME from
          # resolve_branch.py (never from raw github.head_ref).
          # GITHUB_REPOSITORY is a trusted GitHub-set variable.
          REPO_URL="https://github.com/${GITHUB_REPOSITORY}/tree/${BRANCH_NAME}"

          # Construct command arguments as an array to prevent word-splitting
          # and injection issues.
          ARGS=(
            -Xmx6g
            -jar ./input-cache/publisher.jar
            publisher
            -ig .
            -auto-ig-build
            -repo "$REPO_URL"
            -package-cache-folder ./fhir-package-cache
          )

          if [ -n "$INPUT_TX" ]; then
            ARGS+=(-tx "$INPUT_TX")
          fi

          echo "Running: java ${ARGS[*]}"
          java "${ARGS[@]}"

          echo "TS_IG_BUILD=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      # Additional step to upload qa.json as an artifact
      - name: Upload qa.json artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: qa-json-artifact
          path: ./output/qa.json

      # The IG Publisher writes translation files to two locations:
      #   1. output/*.pot  — translation templates (gitignored)
      #   2. translations/{lang}/po/*.po — per-resource per-language .po files
      #      (also gitignored via /translations in .gitignore)
      # Copy .pot files from output/ and merge per-resource .po files from
      # translations/ into a single base.pot for Weblate integration.
      - name: Collect IG Publisher translation files
        if: success()
        run: |
          mkdir -p input/translations
          found=0

          # Copy .pot files from output/
          for pot in $(find output/ -name '*.pot' 2>/dev/null); do
            echo "Found IG Publisher .pot: $pot"
            cp "$pot" input/translations/
            found=$((found + 1))
          done

          # Count .po files from translations/ (IG Publisher i18n output)
          for po in $(find translations/ -name '*.po' 2>/dev/null); do
            echo "Found IG Publisher .po: $po"
            found=$((found + 1))
          done

          echo "Found $found translation file(s) from IG Publisher"

          # Merge per-resource .po files into base.pot using the Python helper.
          if [ -f "input/scripts/run_ig_publisher.py" ]; then
            python3 -c "
          import sys, os
          sys.path.insert(0, os.path.join('.', 'input', 'scripts'))
          from run_ig_publisher import collect_publisher_pot_files
          collect_publisher_pot_files('.')
          " 2>&1 || echo "Warning: Python merge step failed; .pot files from output/ still collected"
          fi

      # Upload translation template (.pot) files produced by the IG Publisher
      # so that downstream jobs (e.g. commit-pot) can reuse them without
      # re-running the publisher.
      - name: Upload POT file artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: pot-files
          path: |
            input/translations/**/*.pot
            input/fsh/translations/**/*.pot
            input/images-source/translations/**/*.pot
            input/images/translations/**/*.pot
            input/archimate/translations/**/*.pot
            input/diagrams/translations/**/*.pot
            input/pagecontent/translations/**/*.pot
          if-no-files-found: ignore
          retention-days: 1

      # ── DAK Postprocessing ─────────────────────────────────────────────
      # No ownership fix needed — the IG Publisher ran on the host as the
      # same user, so output/ files are already writable.

      - name: DAK Postprocessing - Generate JSON Schemas
        if: inputs.do_dak != 'false' && env.DAK_ENABLED == 'true'
        run: |
          echo "Generating JSON schemas from FHIR resources..."
          if [ -f "input/scripts/generate_logical_model_schemas.py" ]; then
            python3 input/scripts/generate_logical_model_schemas.py
            echo "Logical model schemas generated"
          fi
          if [ -f "input/scripts/generate_valueset_schemas.py" ]; then
            python3 input/scripts/generate_valueset_schemas.py
            echo "ValueSet schemas generated"
          fi

      - name: DAK Postprocessing - Generate JSON-LD Vocabularies
        if: inputs.do_dak != 'false' && env.DAK_ENABLED == 'true'
        run: |
          echo "Generating JSON-LD vocabularies from ValueSet expansions..."
          if [ -f "input/scripts/generate_jsonld_vocabularies.py" ]; then
            python3 input/scripts/generate_jsonld_vocabularies.py
            echo "JSON-LD vocabularies generated"
          else
            echo "JSON-LD vocabulary generator not available, skipping"
          fi

      - name: DAK Postprocessing - Generate DAK API Hub
        if: inputs.do_dak != 'false' && env.DAK_ENABLED == 'true'
        run: |
          echo "Generating DAK API documentation hub..."
          if [ -f "input/scripts/generate_dak_api_hub.py" ]; then
            python3 input/scripts/generate_dak_api_hub.py
            echo "DAK API hub generated"
          else
            echo "DAK API hub generator not available, skipping"
          fi

      - name: DAK Postprocessing - Update translated image references
        if: inputs.do_dak != 'false' && env.DAK_ENABLED == 'true'
        run: |
          echo "Updating image references in translated HTML pages..."
          if [ -f "input/scripts/update_translated_image_refs.py" ]; then
            python3 input/scripts/update_translated_image_refs.py
            echo "Translated image references updated"
          else
            echo "update_translated_image_refs.py not available, skipping"
          fi

      - name: DAK Postprocessing - Generate smart.liquid variables
        if: inputs.do_dak != 'false' && env.DAK_ENABLED == 'true'
        run: |
          echo "Generating smart.liquid Liquid variable include from IG Publisher output..."
          if [ -f "input/scripts/generate_smart_liquid.py" ]; then
            python3 input/scripts/generate_smart_liquid.py
            echo "smart.liquid variables generated"
          else
            echo "generate_smart_liquid.py not available, skipping"
          fi

      - name: DAK Postprocessing - Inject smart.liquid include into markdown pages
        if: inputs.do_dak != 'false' && env.DAK_ENABLED == 'true'
        run: |
          echo "Injecting smart.liquid include into DAK IG markdown pages..."
          if [ -f "input/scripts/inject_smart_liquid.py" ]; then
            python3 input/scripts/inject_smart_liquid.py
            echo "smart.liquid include injected into markdown pages"
          else
            echo "inject_smart_liquid.py not available, skipping"
          fi

      - name: Stamp deploy metadata
        if: env.DAK_ENABLED == 'true'
        env:
          GH_SHA: ${{ github.sha }}
        run: python3 input/scripts/stamp_deploy.py output/index.html


      - name: Delete files >100MB before deployment
        run: |
          echo "Removing files over 100 MB from ./output..."
          find ./output -type f -size +100M -print -delete

      - name: Deploy candidate
        uses: JamesIves/github-pages-deploy-action@v4.4.2
        if: env.IS_DEFAULT_BRANCH == 'false' && inputs.deploy != false
        with:
          branch: gh-pages # The branch the action should deploy to.
          folder: ./output # The folder the action should deploy.
          commit-message: Deploy candidate branch
          target-folder: branches/${{ env.BRANCH_DIR }}
          single-commit: true
          clean: false

      - name: Deploy main
        uses: JamesIves/github-pages-deploy-action@v4.4.2
        if: env.IS_DEFAULT_BRANCH == 'true' && inputs.deploy != false
        with:
          branch: gh-pages # The branch the action should deploy to.
          folder: ./output # The folder the action should deploy.
          commit-message: Deploy main branch
          single-commit: true
          clean-exclude: |
            branches
            sitepreview

      - name: Comment on PR - Deployment completed
        if: steps.find_pr.outputs.IS_PR == 'true' && (success() || failure())
        env:
          PR_NUMBER: ${{ steps.find_pr.outputs.PR_NUMBER }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_RUN_ID: ${{ github.run_id }}
          GH_SHA: ${{ github.sha }}
          GH_BRANCH: ${{ github.head_ref || github.ref_name }}
          JOB_STATUS: ${{ job.status }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f "input/scripts/pr_comment_finish.py" ]; then
            python3 input/scripts/pr_comment_finish.py \
              "$PR_NUMBER" \
              "$GH_REPOSITORY" \
              "$GH_RUN_ID" \
              "$GH_SHA" \
              "$GH_BRANCH" \
              "$JOB_STATUS" \
              "$GH_TOKEN"
          else
            echo "PR comment script not available, skipping deployment complete comment"
          fi
