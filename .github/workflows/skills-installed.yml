# The agent hosts' skill directories are current (bean folio-assistant-dtda).
#
# `.github/skills/<prefix>-<name>/` (GitHub Copilot) and
# `.claude/skills/<prefix>-<name>/` (Claude Code) are GENERATED by
# cat-harness-tools' `install-skills.ts` from the skills of smart-base and
# every layer it mounts (index.lock.json). This fails a pull request when
# either tree differs from what an install would write: a skill source edited
# without regenerating, a re-pin that changes a mounted layer's skills, or a
# hand edit to a generated copy. Regenerate with the same command without
# `--check` (see `input/scripts/ig_skills/README.md`).
#
# Not a gate in cat-harness-tools' layer-pr-checks.yml: that workflow judges
# this repository in layer mode, with only `smart-base/` mounted into the
# folio-assistant index, so the host directories at this repository's root
# are not there to check.
#
# A re-pin alone does not run the check (owner, 2026-11-13: "A. Skip
# lock-only, merge"): when every changed file is index.lock.json,
# index.config.json, or a workflow whose only changed lines are
# `uses: litlfred/...@<sha>` pins, the job is skipped, so the standing re-pin
# stays green. The next PR that touches smart-base/ or a host directory runs the
# check against the re-pinned layers, and regenerating is done there.
#
# `bun run cat` mounts the layers from index.lock.json and installs the root's
# dependencies first (`.github/cat.ts`), then runs the script from the root.
name: Installed skills

on:
  pull_request:
    paths:
      - "smart-base/**"
      - ".github/skills/**"
      - ".claude/skills/**"
      - "index.lock.json"
      - ".github/workflows/skills-installed.yml"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: skills-installed-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Is this a re-pin only?
        id: scope
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -eu
          if [ -z "${BASE:-}" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null || [ "$BASE" = 0000000000000000000000000000000000000000 ]; then
            echo "repin_only=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          only=true
          while IFS= read -r f; do
            case "$f" in
              index.lock.json|index.config.json) ;;
              .github/workflows/*.yml|.github/workflows/*.yaml)
                # Every changed line must be a `uses: litlfred/...@<40-hex sha>` pin.
                if git diff -U0 "$BASE" HEAD -- "$f" | grep -E '^[-+]' | grep -vE '^(\+\+\+|---) ' \
                     | grep -vqE '^[-+][[:space:]]*(- )?uses: litlfred/[^@]+@[0-9a-f]{40}([[:space:]]+#.*)?$'; then
                  only=false
                fi ;;
              *) only=false ;;
            esac
          done < <(git diff --name-only "$BASE" HEAD)
          echo "repin_only=$only" >> "$GITHUB_OUTPUT"
          if [ "$only" = true ]; then echo "::notice::Re-pin only (lock, config and workflow pins); the installed-skills check is skipped."; fi
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        if: steps.scope.outputs.repin_only != 'true'
        with:
          bun-version: 1.4.4
      - name: Copilot's skills (.github/skills) are current
        if: steps.scope.outputs.repin_only != 'true'
        run: bun run cat skills:install --root smart-base --into . --host copilot --check
      - name: Claude Code's skills (.claude/skills) are current
        if: ${{ !cancelled() && steps.scope.outputs.repin_only != 'true' }}
        run: bun run cat skills:install --root smart-base --into . --host claude --check
