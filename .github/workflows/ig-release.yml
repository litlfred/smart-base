# Cut a GitHub DRAFT release when a version is tagged. From fhir-harness
# `templates/ig-repo-site/ig-release.yml`, pinned to index.lock.json, with
# smart-base's DAK pre-export and WHO template as in ig-ast-refresh.yml.
#
# The steps live in fhir-harness (`.github/workflows/ig-release.yml`; skill
# `ig-binary-artefacts`, "Releasing"). A full Publisher build of the tag; the
# draft carries package.tgz (and its R4/R4B variants), ast-data.zip (the AST,
# Libraries with their ELM) and SHA256SUMS. A ballot, draft or CI-build version
# is a pre-release. The owner publishes the draft on GitHub; nothing here does.
#
# Tag trigger: the owner chose it for releases (2026-11-09, Q-REL-1 "A"), the
# exception to the by-hand rule of 2026-10-06. Start it by hand for an
# existing tag.
name: IG release (draft)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "The existing tag to release"
        type: string
        required: true

permissions:
  contents: write

jobs:
  release:
    uses: litlfred/fhir-harness/.github/workflows/ig-release.yml@9c04b6fa237c2ab5f6217ffcb42c760f3783b2f3 # index.lock.json
    with:
      tag: ${{ inputs.tag || github.ref_name }}
      # The same overlay and template as ig-ast-refresh.yml: a release is a
      # full build of the tag with the DAK pre-processing.
      pre-export: bash smart-base/scripts/dak-pre-export.sh
      template-repos: who.template.root=WorldHealthOrganization/smart-ig-template
