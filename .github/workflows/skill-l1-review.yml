name: L1 Guideline Review Skill

# Manual trigger only (owner decision, 2026-10-06): GitHub workflows here are
# defined, not run automatically. Start it from the Actions tab.
# (workflow_call, if present, is kept so other repositories can call it.)
on:
  workflow_dispatch:

jobs:
  l1-review:
    if: github.event.label.name == 'content:L1'
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Python dependencies
        run: pip install --require-hashes --no-deps -r .github/skills/requirements.lock

      - name: Run L1 review skill
        env:
          GITHUB_TOKEN:    ${{ secrets.GITHUB_TOKEN }}
          DAK_LLM_API_KEY: ${{ secrets.DAK_LLM_API_KEY }}
          DAK_LLM_MODEL:   ${{ vars.DAK_LLM_MODEL || 'gpt-4o' }}
          ISSUE_NUMBER:    ${{ github.event.issue.number }}
          ISSUE_TITLE:     ${{ github.event.issue.title }}
          ISSUE_BODY:      ${{ github.event.issue.body }}
        run: python3 .github/skills/l1_review/actions/l1_review_action.py
