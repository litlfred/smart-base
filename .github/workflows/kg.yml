# The knowledge-graph schema (smart-base/kg/): Zod source, generated FSH and JSON.
# No smart-kg checkout: smart-kg is deprecated (owner, 2026-10-16) and src/l1.ts is the source of truth.
#
# smart-base/kg/src/*.ts is the source. The ontology JSON, the graph JSON Schema and the FSH logical models,
# code systems and value sets under input/fsh/ are generated from it and committed, so a consumer
# reads them without this toolchain -- and committed generated files go stale silently, which is
# what `npm run check` catches. The IG build (ghbuild.yml) compiles the generated FSH like any other.

name: Knowledge graph schema

# Manual trigger only (owner decision, 2026-10-06): GitHub workflows here are
# defined, not run automatically. Start it from the Actions tab.
# (workflow_call, if present, is kept so other repositories can call it.)
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: smart-base/kg
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: smart-base/kg/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npx tsc -p .

      - name: Generated files are current
        run: npm run check

      - name: Tests
        run: npm test
