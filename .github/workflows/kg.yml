# The knowledge-graph schema: one named subgraph per layer, smart-base/<Layer>/schemas/ (L1, L2, L2-bpmn, L2-dmn, L3).
# The engine every layer uses is in the base layer, smart-base/L1/schemas/. Zod source, generated FSH and JSON.
# No smart-kg checkout: smart-kg is deprecated (owner, 2026-10-16) and smart-base/<Layer>/schemas/<layer>.ts is the source of truth.
#
# smart-base/<Layer>/schemas/*.ts is the source. The ontology JSON, the graph JSON Schema and the FSH logical models,
# code systems and value sets under input/fsh/ are generated from it and committed, so a consumer
# reads them without this toolchain -- and committed generated files go stale silently, which is
# what `npm run check` catches. The IG build (ghbuild.yml) compiles the generated FSH like any other.

name: Knowledge graph schema

# Manual trigger only (owner decision, 2026-10-06): GitHub workflows here are
# defined, not run automatically. Start it from the Actions tab.
# (workflow_call, if present, is kept so other repositories can call it.)
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: smart-base/L1/schemas
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: smart-base/L1/schemas/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npx tsc -p .

      - name: Generated files are current
        run: npm run check

      - name: Tests
        run: npm test
