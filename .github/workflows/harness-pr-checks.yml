# smart-base's checks on every pull request (owner, 2026-10-14: every
# harnessed layer is judged by ONE reusable workflow the harness owns, and
# "there shouldnt be copying of code"). Everything is decided there.
name: Harness PR checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    uses: litlfred/cat-harness-tools/.github/workflows/layer-pr-checks.yml@claude/layer-pr-checks-speed-397
    with:
      # The instance is a sub-directory of this repository, not its root.
      path-in-repo: smart-base
      # TRIAL ONLY (litlfred/cat-harness-tools#406): never merge this branch.
      tools-ref: claude/layer-pr-checks-speed-397
