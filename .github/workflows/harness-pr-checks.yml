# smart-base's harness checks on every pull request.
#
# Owner, 2026-10-14: "There should be CI running", and ("1") through ONE
# reusable workflow the harness owns. The 2026-10-06 ruling that this fork's
# workflows are "defined, not run on events" (fcfe0091b, 6d03cb55b) was about
# the WHO IG builds inherited from upstream, which stay manual; it switched
# the harness gates off with them, and nothing turned them back on.
#
# The checks themselves live in cat-harness-tools
# (`.github/workflows/layer-pr-checks.yml`): smart-base swapped into the
# folio-assistant index; typecheck; its tests; and the gates of smart-base and
# its whole dependency harness, failing only on what this PR newly breaks.
name: Harness PR checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: harness-pr-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    uses: litlfred/cat-harness-tools/.github/workflows/layer-pr-checks.yml@main
    with:
      instance: smart-base
      path-in-repo: smart-base
      tools-ref: main
      # folio-assistant main pins pre-70lx layers until folio-assistant#2529 merges.
      index-ref: claude/nifty-johnson-w3mspn
